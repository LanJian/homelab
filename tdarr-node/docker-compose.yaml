version: '3.5'
services:
  tdarr-node:
    image: "ghcr.io/haveagitgat/tdarr_node:2.89.01"
    container_name: tdarr-node
    restart: unless-stopped
    network_mode: "host"
    environment:
      - TZ=Europe/London
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - nodeName=flamewrought-node
      - serverURL=http://192.168.50.6:8266
      - inContainer=true
      - transcodegpuWorkers=1
      - transcodecpuWorkers=2
      - healthcheckgpuWorkers=1
      - healthcheckcpuWorkers=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /media/black-library:/black-library
      - /tdarr_cache:/temp

    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
